name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm check
          pnpm test
          pnpm build:web
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build Windows executable
        run: pnpm tauri build --no-bundle

      - name: Package portable release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./package.json').version"
          $stageName = "MiSideTag-TS-$version-win64"
          $releaseRoot = Join-Path $PWD "release"
          $stage = Join-Path $releaseRoot $stageName
          $archive = Join-Path $releaseRoot "$stageName.zip"
          $sourceArchive = Join-Path $releaseRoot "MiSideTag-TS-$version-source.zip"
          $targetDir = Join-Path $PWD "src-tauri/target/release"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $targetDir "misidetag-tauri-ts.exe") (Join-Path $stage "MiSideTag.exe")
          $webViewLoader = Join-Path $targetDir "WebView2Loader.dll"
          if (Test-Path -LiteralPath $webViewLoader) {
            Copy-Item -LiteralPath $webViewLoader $stage
          }
          Copy-Item -Path README.md, LICENSE, NOTICE -Destination $stage
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "data") | Out-Null
          Copy-Item ".github/release-data-readme.txt" (Join-Path $stage "data/README.txt")

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -CompressionLevel Optimal
          git archive --format=zip --output="$sourceArchive" HEAD
          @($archive, $sourceArchive) | ForEach-Object {
            $fileHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash
            "$fileHash *$([IO.Path]::GetFileName($_))"
          } | Set-Content (Join-Path $releaseRoot "SHA256SUMS.txt") -Encoding ASCII
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "RELEASE_SOURCE_ARCHIVE=$sourceArchive" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: MiSideTag-TS-windows
          path: |
            release/*.zip
            release/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release create $env:GITHUB_REF_NAME `
            $env:RELEASE_ARCHIVE `
            $env:RELEASE_SOURCE_ARCHIVE `
            "release/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --title "MiSideTag $version" `
            --generate-notes
