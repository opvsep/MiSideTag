[package]
name = "misidetag-tauri-ts"
version = "2.1.0"
description = "MiSideTag desktop lyrics matcher built with Tauri, React and TypeScript"
authors = ["MiSideTag contributors"]
edition = "2024"
license = "GPL-3.0-only"

[lib]
name = "misidetag_ts_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
lofty = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "deflate"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
